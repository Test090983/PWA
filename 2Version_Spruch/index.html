<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#7c3aed" />
  <meta name="description" content="Dein täglicher Motivationsspruch – jeden Morgen neu." />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <title>Spruch des Tages</title>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="container">

    <!-- Header -->
    <header class="header">
      <div class="header-icon" aria-hidden="true">🌅</div>
      <span class="header-label">Spruch des Tages</span>
      <div class="streak-badge" id="streak-badge" title="Tages-Streak">
        🔥 <span id="streak-count">0</span>
      </div>
    </header>

    <!-- Swipe Stack -->
    <div class="swipe-area" id="swipe-area">
      <div class="card swipe-card" id="card-back">
        <span class="quote-mark" aria-hidden="true">"</span>
        <p class="quote-text" id="back-text"></p>
        <div class="quote-divider"></div>
        <span class="quote-author" id="back-author"></span>
      </div>
      <div class="card swipe-card active" id="card-front">
        <span class="tag" id="quote-tag">Tagesspruch</span>
        <span class="quote-mark" aria-hidden="true">"</span>
        <p class="quote-text" id="quote-text">Lade Spruch…</p>
        <div class="quote-divider"></div>
        <span class="quote-author" id="quote-author">—</span>
      </div>

      <!-- Swipe Hint Labels -->
      <div class="swipe-label swipe-left" id="label-skip">👎 Weiter</div>
      <div class="swipe-label swipe-right" id="label-like">❤️ Merken</div>
    </div>

    <!-- Swipe hint -->
    <p class="swipe-hint">← Wischen zum Blättern →</p>

    <!-- Action Buttons -->
    <div class="actions">
      <div class="actions-row">
        <button class="btn btn-icon-only" id="tts-btn" title="Vorlesen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        </button>
        <button class="btn btn-icon-only" id="fav-btn" title="Favorit">
          <svg id="fav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </button>
        <button class="btn btn-icon-only" id="share-btn" title="Als Bild speichern">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        </button>
        <button class="btn btn-icon-only" id="copy-btn" title="Kopieren">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
        </button>
      </div>

      <button class="btn btn-primary" id="new-quote-btn">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
        Neuer Spruch
      </button>

      <button class="btn btn-ai" id="ai-btn">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2z"/></svg>
        ✨ KI-Spruch generieren
      </button>

      <button class="btn btn-notify" id="notify-btn">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        Benachrichtigungen aktivieren
      </button>

      <!-- Extras Menu Button -->
      <button class="btn btn-extras-toggle" id="extras-toggle-btn">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
        <span id="extras-toggle-label">Mehr Features</span>
        <svg class="extras-chevron" id="extras-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
    </div><!-- /actions -->

    <!-- ── Extras Drawer ── -->
    <div class="extras-drawer" id="extras-drawer">
      <div class="extras-drawer-inner">
        <p class="extras-drawer-title">⚡ Geräte-Features</p>
        <div class="extras-grid">

          <button class="extra-card" id="torch-btn">
            <div class="extra-card-icon" style="background:linear-gradient(135deg,#fbbf24,#f59e0b)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6c0-2.21-1.79-4-4-4H10C7.79 2 6 3.79 6 6l2 8h8l2-8z"/><path d="M6 14h12"/><path d="M9 22h6"/><path d="M12 18v4"/></svg>
            </div>
            <span class="extra-card-label">Taschenlampe</span>
            <span class="extra-card-sub" id="torch-sub">Tippen zum Aktivieren</span>
          </button>

          <button class="extra-card" id="location-btn">
            <div class="extra-card-icon" style="background:linear-gradient(135deg,#34d399,#059669)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="10" r="3"/><path d="M12 2a8 8 0 0 0-8 8c0 5.25 8 14 8 14s8-8.75 8-14a8 8 0 0 0-8-8z"/></svg>
            </div>
            <span class="extra-card-label">Mein Ort</span>
            <span class="extra-card-sub" id="location-sub">Stadt &amp; Wetter</span>
          </button>

          <button class="extra-card" id="steps-btn">
            <div class="extra-card-icon" style="background:linear-gradient(135deg,#f472b6,#db2777)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="4" r="2"/><path d="m10 7-2 5h6l-2-5"/><path d="m8 12-1 8"/><path d="m14 12 1 8"/><circle cx="16" cy="4" r="2"/><path d="m18 7-1 3"/></svg>
            </div>
            <span class="extra-card-label">Schrittzähler</span>
            <span class="extra-card-sub" id="steps-sub-label">0 heute</span>
          </button>

          <button class="extra-card" id="ambient-btn">
            <div class="extra-card-icon" style="background:linear-gradient(135deg,#a78bfa,#7c3aed)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
            </div>
            <span class="extra-card-label">Umgebungslicht</span>
            <span class="extra-card-sub" id="ambient-sub">Lichtsensor</span>
          </button>

        </div>

        <!-- Info Panels inside drawer -->
        <div class="info-panel" id="location-panel" style="display:none">
          <div class="panel-content" id="location-content"><div class="panel-spinner"></div></div>
        </div>
        <div class="info-panel" id="steps-panel" style="display:none">
          <div class="steps-display">
            <span class="steps-number" id="steps-count">0</span>
            <span class="steps-label">Schritte heute</span>
            <div class="steps-bar-bg"><div class="steps-bar-fill" id="steps-bar"></div></div>
            <span class="steps-goal">Ziel: 10.000 Schritte</span>
          </div>
        </div>
        <div class="info-panel" id="ambient-panel" style="display:none">
          <div class="ambient-display">
            <div class="ambient-ring" id="ambient-ring">
              <span class="ambient-value" id="ambient-value">—</span>
              <span class="ambient-unit">lx</span>
            </div>
            <span class="ambient-label" id="ambient-label">Lichtsensor wird gestartet…</span>
          </div>
        </div>

      </div>
    </div>

    <p class="status-msg" id="status-msg" role="status" aria-live="polite"></p>

    <!-- Favoriten -->
    <div class="favs-section" id="favs-section" style="display:none">
      <h2 class="favs-title">❤️ Deine Favoriten</h2>
      <div id="favs-list"></div>
    </div>

    <div class="dots" id="dots" aria-hidden="true">
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>

  <!-- Hidden canvas for image export -->
  <canvas id="export-canvas" style="display:none"></canvas>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
